name: System tests

on:
  push:
    branches: [main, research/seven-point-depth-2026-10-06]
  pull_request:
    branches: [main, research/seven-point-depth-2026-10-06]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Run system smoke tests
        run: npm test
      - name: Build
        run: npm run build
