name: PR preview artifact

on:
  pull_request:
    branches: [main, research/seven-point-depth-2026-10-06]
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Build preview
        run: npm run build
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
      - name: Upload preview build
        uses: actions/upload-artifact@v4
        with:
          name: mitt-storhamar-pr-preview
          path: dist
          retention-days: 7
