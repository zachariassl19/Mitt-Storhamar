name: SIL adelskalender data probe
on:
  pull_request:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Capture SIL archive career totals
        run: |
          node <<'NODE'
          const url = 'https://silarkivet.no/samletabeller/adelskalender-total/';
          const response = await fetch(url, {headers:{'User-Agent':'Mitt-Storhamar-Historical-Source-Audit/1.0'}});
          if (!response.ok) throw Error('SIL-arkivet HTTP '+response.status);
          const html = await response.text();
          console.log('html length: '+html.length);
          function clean(s) {
            return s.replace(/<[^>]*>/g,' ').replace(/&nbsp;|&#160;/g,' ').replace(/&amp;/g,'&')
              .replace(/&oslash;/g,'ø').replace(/&aring;/g,'å').replace(/&aelig;/g,'æ')
              .replace(/&Oslash;/g,'Ø').replace(/&Aring;/g,'Å').replace(/&AElig;/g,'Æ')
              .replace(/&#(\d+);/g,(_,code)=>String.fromCharCode(Number(code)))
              .replace(/\s+/g,' ').trim();
          }
          const records=[];
          for(const tr of html.matchAll(/<tr\b[^>]*>([\s\S]*?)<\/tr>/gi)){
            const cells=[...tr[1].matchAll(/<(?:td|th)\b[^>]*>([\s\S]*?)<\/(?:td|th)>/gi)].map(m=>clean(m[1]));
            if(cells.length!==8)continue;
            const [name,position,...figures]=cells;
            if(!name || name.toLowerCase()==='spiller' || !/^[A-ZÆØÅÀÁÂÃÄÇÉÈÍÎÏÑÓÔÖÜÚß]/u.test(name))continue;
            const numbers=figures.map(x=>Number(x.replace(/[^0-9]/g,'')));
            if(numbers.length!==6 || numbers.some(x=>!Number.isFinite(x)))continue;
            const [seasons,games,goals,assists,points,penaltyMinutes]=numbers;
            if(games===0 || games>3000 || seasons>100) continue;
            records.push({name,position,seasons,games,goals,assists,points,penaltyMinutes});
          }
          console.log('Parsed SIL rows '+records.length+' first '+JSON.stringify(records.slice(0,3))+' last '+JSON.stringify(records.slice(-3)));
          if(records.length<300 || records[0]?.name!=='Pål Johnsen' || records[0]?.games!==963) throw Error('Parser did not find expected SIL adelskalender table');
          console.log('SIL_SNAPSHOT_BEGIN'+JSON.stringify({source:url,asOf:'2025/26',fetchedAt:'2026-11-03',entries:records})+'SIL_SNAPSHOT_END');
          NODE
