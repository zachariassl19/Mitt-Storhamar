name: Android debug APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - '.github/workflows/android-debug.yml'

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: npm install
      - name: Validate and build Android web assets
        run: npm run build:android
      - name: Generate native project
        run: npx cap add android
      - name: Sync web assets and plugins
        run: npx cap sync android
      - name: Build unsigned-for-release debug APK
        working-directory: android
        run: bash gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mitt-storhamar-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
